<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fb">
  <title>练歌房</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #f7f8fb; color: #182033; font-family: system-ui, sans-serif; }
    button, input, select { font: inherit; }
    button { min-height: 42px; border: 1px solid #c9cfda; border-radius: 8px; background: #fff; color: #182033; padding: 0 12px; }
    button.primary { background: #ff4d57; border-color: #ff4d57; color: #fff; }
    button:disabled { opacity: .55; }
    input, select { width: 100%; min-height: 44px; border: 1px solid #c9cfda; border-radius: 8px; background: #fff; padding: 0 12px; color: #182033; }
    .app { min-height: 100vh; padding: 14px; display: grid; gap: 12px; align-content: start; }
    .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .topbar p, .muted, .status { color: #687386; font-size: 13px; margin: 0; }
    h1, h2, h3 { margin: 0; }
    h1 { font-size: 24px; }
    h2 { font-size: 18px; }
    .card { border: 1px solid #d9dee8; border-radius: 8px; background: #fff; padding: 12px; display: grid; gap: 12px; }
    label { display: grid; gap: 6px; color: #3b4658; font-size: 13px; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    .server-list { display: grid; gap: 8px; }
    .server-list button { height: auto; min-height: 50px; display: grid; justify-items: start; gap: 2px; text-align: left; }
    .server-list span { max-width: 100%; color: #687386; font-size: 12px; overflow-wrap: anywhere; }
    .progress { height: 6px; border-radius: 999px; background: #e6eaf1; overflow: hidden; }
    .progress span { display: block; width: 0; height: 100%; background: #ff4d57; transition: width .2s ease; }
    .player { display: grid; gap: 12px; }
    .player[hidden] { display: none; }
    audio { width: 100%; }
    .lyrics { display: grid; gap: 8px; max-height: calc(100vh - 430px); min-height: 210px; overflow: auto; padding-bottom: 12px; }
    .lyric-line { width: 100%; height: auto; min-height: 48px; text-align: center; line-height: 1.55; overflow-wrap: anywhere; }
    .lyric-line.active { border-color: #ff4d57; background: #fff1f2; }
    .lyric-line small { display: block; color: #7b8494; font-size: 13px; margin-top: 4px; }
    rt { color: #7b8494; font-size: .62em; }
    .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: calc(100vw - 28px); background: #182033; color: #fff; border-radius: 8px; padding: 10px 13px; font-size: 14px; }
    @media (max-width: 420px) { .row { display: grid; } .lyrics { max-height: calc(100vh - 470px); } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p>离线 APK</p>
        <h1>练歌房</h1>
      </div>
      <button type="button" id="reloadLocal">本地库</button>
    </header>

    <section class="card">
      <h2>同步来源</h2>
      <label>
        <span>云端配置 URL</span>
        <input id="cloudConfigUrl" type="url" placeholder="https://example.com/utapractice-app.json">
      </label>
      <label>
        <span>飞牛后端地址</span>
        <input id="serverUrl" type="url" placeholder="http://192.168.68.200:8502">
      </label>
      <div class="row">
        <button type="button" id="loadCloud">读取云端</button>
        <button type="button" id="testServer">测试连接</button>
      </div>
      <div class="server-list" id="serverList"></div>
      <p class="status" id="serverStatus">未连接；可直接使用已同步的本地库。</p>
    </section>

    <section class="card">
      <h2>离线库</h2>
      <div class="row">
        <button type="button" id="syncAll" class="primary">同步全部</button>
        <button type="button" id="syncSelected">同步当前</button>
      </div>
      <div class="progress"><span id="syncProgress"></span></div>
      <p class="status" id="syncStatus">尚未同步。</p>
      <label>
        <span>选择歌曲</span>
        <select id="songSelect"></select>
      </label>
    </section>

    <section class="card player" id="player" hidden>
      <p class="muted" id="songMeta"></p>
      <h2 id="songTitle"></h2>
      <audio id="audio" controls preload="metadata"></audio>
      <div class="lyrics" id="lyrics"></div>
    </section>
  </main>
  <div class="toast" id="toast" hidden></div>

  <script>
    const DB_NAME = "utapractice-offline";
    const DB_VERSION = 1;
    const DEFAULT_SERVER = "http://192.168.68.200:8502";
    const keys = {
      serverUrl: "serverUrl",
      cloudConfigUrl: "cloudConfigUrl",
      lastSync: "lastSync",
    };
    const state = {
      db: null,
      songs: [],
      current: null,
      audioUrl: null,
      activeLine: null,
    };
    const els = {
      cloudConfigUrl: document.getElementById("cloudConfigUrl"),
      serverUrl: document.getElementById("serverUrl"),
      loadCloud: document.getElementById("loadCloud"),
      testServer: document.getElementById("testServer"),
      serverList: document.getElementById("serverList"),
      serverStatus: document.getElementById("serverStatus"),
      syncAll: document.getElementById("syncAll"),
      syncSelected: document.getElementById("syncSelected"),
      syncProgress: document.getElementById("syncProgress"),
      syncStatus: document.getElementById("syncStatus"),
      songSelect: document.getElementById("songSelect"),
      player: document.getElementById("player"),
      songMeta: document.getElementById("songMeta"),
      songTitle: document.getElementById("songTitle"),
      audio: document.getElementById("audio"),
      lyrics: document.getElementById("lyrics"),
      toast: document.getElementById("toast"),
      reloadLocal: document.getElementById("reloadLocal"),
    };

    function openDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains("songs")) db.createObjectStore("songs", { keyPath: "name" });
          if (!db.objectStoreNames.contains("audio")) db.createObjectStore("audio", { keyPath: "name" });
          if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", { keyPath: "key" });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function tx(store, mode = "readonly") {
      return state.db.transaction(store, mode).objectStore(store);
    }

    function idbRequest(request) {
      return new Promise((resolve, reject) => {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function getAll(store) {
      return idbRequest(tx(store).getAll());
    }

    function getOne(store, key) {
      return idbRequest(tx(store).get(key));
    }

    function putOne(store, value) {
      return idbRequest(tx(store, "readwrite").put(value));
    }

    function cleanUrl(value) {
      return String(value || "").trim().replace(/\/+$/, "");
    }

    function serverUrl() {
      return cleanUrl(els.serverUrl.value || DEFAULT_SERVER);
    }

    function api(path) {
      return `${serverUrl()}${path}`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.hidden = false;
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => { els.toast.hidden = true; }, 2200);
    }

    function setProgress(done, total) {
      const percent = total ? Math.round(done / total * 100) : 0;
      els.syncProgress.style.width = `${Math.max(0, Math.min(100, percent))}%`;
    }

    async function fetchJson(path) {
      const response = await fetch(api(path), { cache: "no-store", mode: "cors" });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
      return payload;
    }

    async function fetchBlob(path) {
      const response = await fetch(api(path), { cache: "no-store", mode: "cors" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.blob();
    }

    function normalizeCloudServers(config) {
      if (!config || typeof config !== "object") return [];
      const servers = Array.isArray(config.servers) ? config.servers : [];
      const normalized = servers.map((server) => ({
        name: String(server.name || server.label || server.base_url || server.baseUrl || "服务器"),
        baseUrl: cleanUrl(server.base_url || server.baseUrl || server.url),
      })).filter((server) => server.baseUrl);
      const defaultUrl = cleanUrl(config.default_base_url || config.defaultBaseUrl || config.api_base_url || config.apiBaseUrl);
      if (defaultUrl && !normalized.some((server) => server.baseUrl === defaultUrl)) {
        normalized.unshift({ name: "默认服务器", baseUrl: defaultUrl });
      }
      return normalized;
    }

    function renderServers(servers) {
      els.serverList.innerHTML = "";
      for (const server of servers) {
        const button = document.createElement("button");
        button.type = "button";
        button.innerHTML = `<strong>${escapeHtml(server.name)}</strong><span>${escapeHtml(server.baseUrl)}</span>`;
        button.addEventListener("click", () => {
          els.serverUrl.value = server.baseUrl;
          localStorage.setItem(keys.serverUrl, server.baseUrl);
          showToast("已选择服务器");
        });
        els.serverList.append(button);
      }
      if (!servers.length) els.serverList.textContent = "云端配置没有服务器列表";
    }

    async function loadCloudConfig() {
      const url = cleanUrl(els.cloudConfigUrl.value);
      if (!url) throw new Error("请填写云端配置 URL");
      localStorage.setItem(keys.cloudConfigUrl, url);
      els.serverStatus.textContent = "正在读取云端配置...";
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) throw new Error(`云端返回 ${response.status}`);
      const config = await response.json();
      const servers = normalizeCloudServers(config);
      renderServers(servers);
      if (servers[0]) {
        els.serverUrl.value = servers[0].baseUrl;
        localStorage.setItem(keys.serverUrl, servers[0].baseUrl);
      }
      els.serverStatus.textContent = `云端配置已读取：${servers.length} 个服务器`;
    }

    async function testServer() {
      localStorage.setItem(keys.serverUrl, serverUrl());
      els.serverStatus.textContent = "正在测试后端...";
      const health = await fetchJson("/api/app/health");
      els.serverStatus.textContent = `已连接 ${health.name || "utapractice"}，服务端 ${health.songs_count ?? 0} 首歌`;
    }

    async function loadLocalSongs() {
      state.songs = (await getAll("songs")).sort((a, b) => a.name.localeCompare(b.name, "zh-Hans-CN"));
      renderSongOptions();
      const lastSync = await getOne("meta", keys.lastSync);
      els.syncStatus.textContent = lastSync ? `上次同步：${lastSync.value}` : "本地库为空或尚未同步。";
      if (state.songs[0]) await selectSong(state.songs[0].name);
    }

    function renderSongOptions() {
      els.songSelect.innerHTML = "";
      if (!state.songs.length) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "暂无离线歌曲";
        els.songSelect.append(option);
        els.player.hidden = true;
        return;
      }
      for (const song of state.songs) {
        const option = document.createElement("option");
        option.value = song.name;
        option.textContent = song.name;
        els.songSelect.append(option);
      }
    }

    async function syncSong(songSummary, ordinal, total) {
      els.syncStatus.textContent = `同步 ${ordinal}/${total}：${songSummary.name}`;
      const detail = await fetchJson(`/api/songs/${encodeURIComponent(songSummary.name)}`);
      const record = {
        ...songSummary,
        ...detail,
        synced_at: new Date().toISOString(),
      };
      await putOne("songs", record);
      if (detail.has_audio) {
        const key = Number(detail.saved_key || 0);
        const blob = await fetchBlob(`/api/songs/${encodeURIComponent(detail.name)}/audio?key=${key}`);
        await putOne("audio", { name: detail.name, blob, content_type: blob.type || "audio/mpeg", key });
      }
    }

    async function syncAllSongs() {
      localStorage.setItem(keys.serverUrl, serverUrl());
      els.syncAll.disabled = true;
      els.syncSelected.disabled = true;
      setProgress(0, 1);
      try {
        const remoteSongs = await fetchJson("/api/songs");
        const total = remoteSongs.length;
        let done = 0;
        let failed = 0;
        for (const song of remoteSongs) {
          try {
            await syncSong(song, done + 1, total);
          } catch (error) {
            failed += 1;
            console.error("sync failed", song.name, error);
          }
          done += 1;
          setProgress(done, total);
        }
        await putOne("meta", { key: keys.lastSync, value: new Date().toLocaleString() });
        await loadLocalSongs();
        els.syncStatus.textContent = failed ? `同步完成，${failed} 首失败；其余已可离线使用。` : "同步完成，已可离线使用。";
        showToast("同步完成");
      } finally {
        els.syncAll.disabled = false;
        els.syncSelected.disabled = false;
      }
    }

    async function syncSelectedSong() {
      const name = els.songSelect.value;
      if (!name) throw new Error("没有选中的歌曲");
      localStorage.setItem(keys.serverUrl, serverUrl());
      els.syncSelected.disabled = true;
      setProgress(0, 1);
      try {
        const remoteSongs = await fetchJson("/api/songs");
        const summary = remoteSongs.find((song) => song.name === name) || { name };
        await syncSong(summary, 1, 1);
        setProgress(1, 1);
        await loadLocalSongs();
        els.songSelect.value = name;
        await selectSong(name);
        els.syncStatus.textContent = `已同步：${name}`;
      } finally {
        els.syncSelected.disabled = false;
      }
    }

    function renderLyrics(lines) {
      els.lyrics.innerHTML = "";
      state.activeLine = null;
      if (!Array.isArray(lines) || !lines.length) {
        els.lyrics.textContent = "这首歌没有离线歌词";
        return;
      }
      for (let index = 0; index < lines.length; index += 1) {
        const line = lines[index];
        const button = document.createElement("button");
        button.type = "button";
        button.className = "lyric-line";
        button.dataset.start = String(line.time || 0);
        button.dataset.end = String(lines[index + 1]?.time || 999999);
        button.innerHTML = `${line.original_html || ""}${line.translation ? `<small>${escapeHtml(line.translation)}</small>` : ""}`;
        button.addEventListener("click", () => {
          if (!els.audio.src) return;
          els.audio.currentTime = Number(line.time || 0);
          els.audio.play().catch(() => {});
        });
        els.lyrics.append(button);
      }
    }

    function highlightLyric() {
      const current = els.audio.currentTime || 0;
      for (const line of els.lyrics.querySelectorAll(".lyric-line")) {
        const start = Number(line.dataset.start);
        const end = Number(line.dataset.end);
        if (current >= start && current < end) {
          if (state.activeLine !== line) {
            state.activeLine?.classList.remove("active");
            line.classList.add("active");
            state.activeLine = line;
            line.scrollIntoView({ block: "center", behavior: "smooth" });
          }
          return;
        }
      }
    }

    async function selectSong(name) {
      const song = await getOne("songs", name);
      if (!song) return;
      state.current = song;
      els.player.hidden = false;
      els.songTitle.textContent = song.name;
      els.songMeta.textContent = `${song.has_audio ? "已缓存音频" : "无音频"} · ${song.has_lyrics ? "已缓存歌词" : "无歌词"} · ${song.synced_at || ""}`;
      if (state.audioUrl) URL.revokeObjectURL(state.audioUrl);
      state.audioUrl = null;
      const audio = await getOne("audio", name);
      if (audio?.blob) {
        state.audioUrl = URL.createObjectURL(audio.blob);
        els.audio.hidden = false;
        els.audio.src = state.audioUrl;
      } else {
        els.audio.hidden = true;
        els.audio.removeAttribute("src");
      }
      renderLyrics(song.lyrics || []);
    }

    async function boot() {
      state.db = await openDb();
      els.serverUrl.value = localStorage.getItem(keys.serverUrl) || DEFAULT_SERVER;
      els.cloudConfigUrl.value = localStorage.getItem(keys.cloudConfigUrl) || "";
      await loadLocalSongs();
    }

    els.loadCloud.addEventListener("click", () => loadCloudConfig().catch((error) => {
      els.serverStatus.textContent = `云端配置失败：${error.message}`;
      showToast("读取云端失败");
    }));
    els.testServer.addEventListener("click", () => testServer().catch((error) => {
      els.serverStatus.textContent = `连接失败：${error.message}`;
      showToast("后端不可用");
    }));
    els.syncAll.addEventListener("click", () => syncAllSongs().catch((error) => {
      els.syncStatus.textContent = `同步失败：${error.message}`;
      showToast("同步失败");
    }));
    els.syncSelected.addEventListener("click", () => syncSelectedSong().catch((error) => showToast(error.message)));
    els.songSelect.addEventListener("change", () => selectSong(els.songSelect.value).catch((error) => showToast(error.message)));
    els.reloadLocal.addEventListener("click", () => loadLocalSongs().catch((error) => showToast(error.message)));
    els.audio.addEventListener("timeupdate", highlightLyric);

    boot().catch((error) => {
      els.syncStatus.textContent = `本地库打开失败：${error.message}`;
      showToast("本地库不可用");
    });
  </script>
</body>
</html>

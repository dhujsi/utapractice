services:
  utapractice:
    build: .
    container_name: utapractice
    ports:
      - "8502:8501"
    environment:
      NETEASE_BRIDGE_BASE: http://netease-bridge:8503
    volumes:
      - ./data/songs:/app/songs
      - ./data/songs_archived:/app/songs_archived
      - ./data/song_db.json:/app/song_db.json
      - ./data/lyrics_jobs.json:/app/lyrics_jobs.json
      - ./data/settings.local.json:/app/settings.local.json
    depends_on:
      - ncm-api
      - netease-bridge
    restart: always
    labels:
      watchcow.enable: "true"
      watchcow.display_name: "练歌"
      watchcow.service_port: "8502"
      watchcow.protocol: "http"
      watchcow.path: "/"

  ncm-api:
    build:
      context: .
      dockerfile: Dockerfile.ncm
    container_name: utapractice-ncm-api
    restart: always

  netease-bridge:
    build:
      context: .
      dockerfile: Dockerfile.netease
    container_name: utapractice-netease-bridge
    ports:
      - "8503:8503"
    volumes:
      - ./data/songs:/data/songs
      - ./data/netease:/data/state
    environment:
      NCM_API_BASE: http://ncm-api:3000
      SONG_DIR: /data/songs
      STATE_PATH: /data/state/session.json
      PORT: "8503"
    depends_on:
      - ncm-api
    restart: always

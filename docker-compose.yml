services:
  utapractice:
    build: .
    container_name: utapractice
    ports:
      - "8502:8501"
    environment:
      NETEASE_BRIDGE_BASE: http://netease-bridge:8503
      DATA_DIR: /data
    volumes:
      - ./data:/data
    depends_on:
      - ncm-api
      - netease-bridge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/api/app/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    labels:
      watchcow.enable: "true"
      watchcow.display_name: "练歌"
      watchcow.service_port: "8502"
      watchcow.protocol: "http"
      watchcow.path: "/"

  ncm-api:
    build:
      context: .
      dockerfile: Dockerfile.ncm
    container_name: utapractice-ncm-api
    restart: always

  netease-bridge:
    build:
      context: .
      dockerfile: Dockerfile.netease
    container_name: utapractice-netease-bridge
    ports:
      - "8503:8503"
    volumes:
      - ./data/songs:/data/songs
      - ./data/netease:/data/state
    environment:
      NCM_API_BASE: http://ncm-api:3000
      SONG_DIR: /data/songs
      STATE_PATH: /data/state/session.json
      PORT: "8503"
    depends_on:
      - ncm-api
    restart: always
